[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-log-classifier"
version = "0.1.0"
description = "A confidence-aware hybrid log classification service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
hybrid-log = "hybrid_log_classifier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
